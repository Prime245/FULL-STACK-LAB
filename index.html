<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card mx-auto p-3 shadow" style="max-width: 350px;">

        <h3 class="text-center mb-3">Calculator</h3>

        <input type="text" class="form-control mb-3 text-end" placeholder="0">

        <div class="row g-2">

            <div class="col-3">
                <button class="btn btn-danger w-100">C</button>
            </div>

            <div class="col-3">
                <button class="btn btn-secondary w-100">/</button>
            </div>

            <div class="col-3">
                <button class="btn btn-secondary w-100">*</button>
            </div>

            <div class="col-3">
                <button class="btn btn-secondary w-100">−</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light border w-100">7</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light border w-100">8</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light border w-100">9</button>
            </div>

            <div class="col-3">
                <button class="btn btn-secondary w-100">+</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light border w-100">4</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light border w-100">5</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light border w-100">6</button>
            </div>

            <div class="col-3">
                <button class="btn btn-primary w-100 h-100">=</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light border w-100">1</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light border w-100">2</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light border w-100">3</button>
            </div>

            <div class="col-9">
                <button class="btn btn-light border w-100">0</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light border w-100">.</button>
            </div>

        </div>
    </div>
</div>

</body>
</html>
